name: Release APK

# Сборка релизного APK по тегу вида Silo.1.Client.
# Тег = versionName, число после "Silo." = versionCode.
on:
  push:
    tags:
      - 'Silo.*.Client'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Не задан секрет KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 -d > keys/freekeys.jks
          ls -l keys/freekeys.jks

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CODE="$(echo "$TAG" | sed -nE 's/^Silo\.([0-9]+)\.Client$/\1/p')"
          if [ -z "$CODE" ]; then
            echo "Тег должен иметь вид Silo.N.Client, получен: $TAG" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Версия: $TAG (versionCode $CODE)"

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./build.sh \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: SHA256
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
